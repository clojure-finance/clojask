name: test

on:
  push:
    branches: ["2.x.x"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: m2-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: m2-${{ runner.os }}-
      - run: clojure -T:build javac
      - run: clojure -X:test
