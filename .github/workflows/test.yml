name: test

on:
  push:
    branches: ["2.x.x"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          # 2.13.0's bin/lein still says LEIN_VERSION 2.12.1-SNAPSHOT, so
          # setup-clojure cannot install it
          lein: 2.12.0
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('project.clj') }}
          restore-keys: m2-${{ runner.os }}-
      - run: lein test
